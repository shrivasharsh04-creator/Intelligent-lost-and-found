{% extends "base.html" %}
{% block title %}Register · Intelligent Lost & Found{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Create an account</h1>
    <p class="muted">Register with your institutional email.</p>
    <form method="post">
      <label>Full Name
        <input type="text" name="name" required autofocus>
      </label>
      <label>Email
        <input type="email" name="email" required>
      </label>
      <label>Password
        <input type="password" name="password" minlength="6" required>
      </label>
      <label class="checkbox-row">
        <input type="checkbox" name="admin_signup">
        Register as administrator (demo only)
      </label>
      <button class="btn-primary" type="submit">Register</button>
    </form>
    <p class="muted small">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
