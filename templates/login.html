{% extends "base.html" %}
{% block title %}Login · Intelligent Lost & Found{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="muted">Log in to report items and view potential matches.</p>
    <form method="post">
      <label>Email
        <input type="email" name="email" required autofocus>
      </label>
      <label>Password
        <input type="password" name="password" required>
      </label>
      <button class="btn-primary" type="submit">Log In</button>
    </form>
    <p class="muted small">No account? <a href="{{ url_for('register') }}">Register here</a></p>
  </div>
</div>
{% endblock %}
